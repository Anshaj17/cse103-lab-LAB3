<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>calculator app</title>
    <style>
        *{
            text-align: center;
            margin:auto;
        }
        h1{
            color:teal;
            margin-top:50px;
        }

        .calculator{
            border:1px;
            width:450px;
            height: 530px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
            border-radius: 15px;
        }

        .input{
            border:1px;
            width: 400px;
            height: 80px;
              border-radius: 15px;
              margin-bottom: 20px;
              margin-top: 10px;
              box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .keyboard{
            border:1px ;
            width: 400px;
            height: 390px;
            margin-bottom:auto;
            border-radius: 15px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .keyboard>div{
            border:1px ;
            padding: 22px 35px;
            font-size: 30px;
            font-weight: 900;
            border-radius: 15px;
            box-shadow: rgba(0, 0, 0, 0.35) 0px 5px 15px;
        }

        .blk{
            background-color: black;
            color:white;
        }
        .red{
            background-color: red;
            color:black;
        }
    </style>
</head>
<body>
    <h1>Calculator App</h1>

    <div class="calculator">
        <div class="input"></div>
        <div class="keyboard">
            <div>1</div>
            <div>2</div>
            <div>3</div>
            <div class="blk">+</div>
            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div class="blk">-</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div class="blk">*</div>
            <div class="red">c</div>
            <div>0</div>
            <div class="blk">=</div>
            <div class="blk">/</div>
        </div>
    </div>
</body>
</html>
