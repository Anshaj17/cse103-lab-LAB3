<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo class</title>
    <!--
    syntax:
    virtual provide new state/behaviour/property to elements -->

    <style>
        button:hover{
            background-color: red;
        }
        button:active{
            background-color: green;
        }
        input:disabled{
            color:aquamarine;
            background-color: yellow;
        }
        input:checked + p{
            color: green;
        }
        li{
            color:red;
        }
        ul>li:nth-child(even){
            color:greenyellow;
        }
    </style>
</head>
<body>
    <button>click</button>

    <br>

<input type="text" placeholder="Enter your name">

<input type="text" placeholder="Enter your name"disabled>
<br><br>
<input type="checkbox" name="" id="">
<p>Apply color of this tag to green</p>

<ul>
    <li>1</li>
    <li>2</li>
    <li>3</li>
    <li>4</li>
    <li>5</li>
    <li>6</li>
    <li>7</li>
    <li>8</li>
    <li>9</li>
    <li>10</li>
</ul>
    
</body>
</html>
