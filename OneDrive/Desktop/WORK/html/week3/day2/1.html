<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Forms</title>
    <!-- Forms => collection of input tag -->
</head>

<body>
    <form action="">
        <!-- name input:type=text -->
        <label for="name">Name: </label>
        <input type="text" name="Name" id="name" required placeholder="Enter your name">
        <br><br>

        <!-- Email input:type=email -->
        <label for="email">Email: </label>
        <input type="email" name="Email" id="email" required placeholder="Enter your email ">
        <br><br>

        <!-- password input:type=password -->
        <label for="password">Password: </label>
        <input type="password" name="password" id="password" required placeholder="Enter your password " minlength="8"
            maxlength="15">
        <br><br>

        <!-- Age input:type=number -->
        <label for="age">Age: </label>
        <input type="number" name="Age" id="Age" required placeholder="Enter your Age" min="18" max="45">
        <br><br>

        <!-- dob input:type=date -->
        <label for="dob">Dob: </label>
        <input type="date" name="dob" id="dob" required placeholder="Enter your dob" min="2020-01-01">
        <br><br>

        <!-- gender input:type=radio -->
        <label for="gender">Gender: </label>

        <input type="radio" name="gender" id="male" value="male">
        <label for="male">Male</label>

        <input type="radio" name="gender" id="female" value="female">
        <label for="female">Female</label>
        <br><br>

        <!-- languag input:type=checkbox -->
        <label for="language">Language: </label>

        <input type="checkbox" name="language" id="html" value="html">
        <label for="html">Html</label>

        <input type="checkbox" name="language" id="css" value="css">
        <label for="css">css</label>

        <input type="checkbox" name="language" id="js" value="js">
        <label for="js">js</label>
        <br><br>

        <!-- file input type:file -->
        <!-- <label for="photo">Photo: </label>
        <input type="file" name="file" id="file">
        <br><br> -->

        <!-- dropdown menu select -->

        <label for="country">Country: </label>
        <select name="country" id="">
            <option value="">choose</option>
            <option value="india">India</option>
            <option value="germany">Germany</option>
            <option value="russia">Russia</option>

        </select>
        <br><br>

        <!-- address textarea -->
        <label for="address">Address: </label>
        <textarea name="" id="" rows="5" cols="8"></textarea>
        <br><br>

        <!-- <button>Submit</button> -->

        <input type="submit" name="" id="">
        <input type="reset" name="" id="">
    </form>
</body>

</html>
