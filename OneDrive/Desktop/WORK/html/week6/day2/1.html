<!DOCTYPE html>
<html lang="en">
<head>

    <style>
        .cont{
           height: 1200px
           border: 1px solid
           padding: 20px
        }
        #sticky{
            position: sticky;
            top: 0px;.
            padding: 100px;
            background-color: yellow;
        }
        #absolute{
            position: absolute;
            top: 90px;
            left: 50px;
            background-color: red;
        }
        #relative{
            position: relative;
            top: 200px;
            left: 100px;
            background-color: green;
                   }
        #fixed{
            position: fixed;
            top: 67px;
            left: 200px;
            background-color: blue;
        }
        #static{
            position: static;
            top: 55px;
            left: 85px;
            background-color: orange;
        }           

                   
                   </style>
    
    <title>css position</title>

</head>

<body>
    <div class="cont">
      <div id="relative">relative position</div>
      <div id="absolute">absolute position</div>
      <div id="static">static position</div>
      <div id="fixed">fixed position</div>
      <div id="sticky">sticky position</div>
    </div>
    
</body>
</html>
