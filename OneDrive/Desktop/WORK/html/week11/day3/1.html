<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gradient</title>
    <style>
      .cont{
        width:100px;
        height:100px;
        border:1px solid red;
        background-image: linear-gradient(to top,pink,teal,yellow);
      }
      .head{
        width: 100px;
        height:100px;
        border:1px solid red;
        border-radius: 50%;
        background-image: radial-gradient(green,white,orange);
      }
      .tail{
        width:100px;
        height:100px;
        border:1px solid red;
        background-image: radial-gradient(ellipse at top,red,black,yellow);
      }
    </style>
</head>
<body>
    <div class="cont"></div>
    <div class="head"></div>
    <div class="tail"></div>
</body>
</html>
