<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Animations</title>
    <style>
        @keyframes rotate
        {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }
    .cont {
        width: 100px;
        height: 100px;
        border-radius: 30%;
        background-image: radial-gradient(yellow,red,blue);
        animation-name: rotate,fadein;
        animation-duration:5s;
        animation-delay: 0ms;
        animation-timing-function: ease-in-out;
        animation-direction: alternate;
        animation-iteration-count: infinite;
        animation-fill-mode: forwards;
    }
        @keyframes fadein
        {
            from
            {
                opacity:0;
            }
            to
            {
                opacity:1
            }
        }
    .head{
        width: 100px;
        height: 100px;
        border-radius: 30%;
        background-image: radial-gradient(orange,blue,pink);
        animation-name: fadein,rotate;
        animation-duration:5s;
        animation-delay: 0ms;
        animation-timing-function: ease-in-out;
        animation-direction: alternate-reverse;
        animation-iteration-count: infinite;
        animation-fill-mode: backwards;
        }
    </style>
</head>

<body>
    <div class="cont"></div>
    <div class="head"></div>
</body>

</html>
